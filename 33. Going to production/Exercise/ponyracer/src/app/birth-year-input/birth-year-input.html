<div class="row d-flex align-items-center">
  <div class="col-3">
    <input
      class="form-control"
      [id]="inputId()"
      [value]="rawValue()"
      [disabled]="disabled()"
      [class.is-invalid]="touched() && invalid()"
      (input)="onBirthYearInput($event)"
      (blur)="touch.emit()"
      type="number"
    />
  </div>
  <div class="col formatted-year">
    <!-- formatted year here -->
    {{ value() }}
  </div>
</div>
