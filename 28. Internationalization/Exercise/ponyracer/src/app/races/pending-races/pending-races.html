<ng-container *transloco="let t">
  @if (races.isLoading()) {
    <div role="status">{{ t('races.loading') }}</div>
  } @else if (races.hasValue()) {
    @for (race of races.value(); track race.id) {
      <div>
        <pr-race [raceModel]="race" />
        <a [routerLink]="['/races', race.id]" class="btn btn-primary mb-2">{{ t('pending-races.bet', {name: race.name } )}}</a>
      </div>
    }
  } @else if (races.error()) {
    <ngb-alert type="danger" [dismissible]="false">{{ t('races.error') }}</ngb-alert>
  }
</ng-container>
