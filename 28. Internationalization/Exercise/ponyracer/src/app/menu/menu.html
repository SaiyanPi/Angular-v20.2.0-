<ng-container *transloco="let t">
<nav class="navbar navbar-expand-md navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">PonyRacer</a>
    <button type="button" class="navbar-toggler" (click)="toggleNavbar()" [ariaLabel]="t('menu.toggle')">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="navbar" class="navbar-collapse" [ngbCollapse]="navbarCollapsed()">
      <ul class="navbar-nav me-auto">
        @if (user.value()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/races">{{ t('menu.races')}}</a>
          </li>
        }
      </ul>

      <div class="navbar-nav">
        <select class="form-select" [formField]="languageForm.lang" [ariaLabel]="t('menu.language')">
          @for (lang of availableLangs; track lang) {
            <option [value]="lang">{{ lang }}</option>
          }
        </select>
      </div>

      @if (user.value(); as user) {
        <ul class="navbar-nav">
          <li class="navbar-item">
            <a class="nav-link" routerLink="/score-history">
              <span id="current-user" class="me-2">
                {{ user.login }}
                <span class="fa fa-star"></span>
                {{ user.money | number }}
              </span>
            </a>
          </li>
          <li class="nav-item">
            <button id="logout-link" type="button" class="btn nav-link" [ariaLabel]="t('menu.logout')" (click)="logout()">
              <span class="fa fa-power-off"></span>
            </button>
          </li>
        </ul>
      }
    </div>
  </div>
</nav>
</ng-container>
